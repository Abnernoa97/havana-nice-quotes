name: Remove obsolete canvas ref
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-obsolete-canvas-ref.yml'
permissions:
  contents: write
jobs:
  delete-temporary-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the reference is merged into main before removal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TEMP_BRANCH: refactor/template-canvas-modular-20261119
          EXPECTED_SHA: 9e596043c0f3aedbc1d8f08d88e478d30f0056e2
        run: |
          set -euo pipefail
          current_temp="$(gh api "repos/$REPO/git/ref/heads/$TEMP_BRANCH" --jq '.object.sha')"
          if [[ "$current_temp" != "$EXPECTED_SHA" ]]; then
            echo "Unexpected branch update: refusing to delete"
            exit 1
          fi
          main_head="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          status="$(gh api "repos/$REPO/compare/$EXPECTED_SHA...$main_head" --jq '.status')"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Temporary commit is not in main: refusing to delete"
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$TEMP_BRANCH"
          echo "Removed only $TEMP_BRANCH. Main retained."
