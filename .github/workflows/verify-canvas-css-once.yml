name: Verify canvas CSS cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-canvas-css-once.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit tests types and build
        run: npm run build
