name: Validate modular canvas navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-canvas-navigation-once.yml'
      - 'src/features/editor/canvas/media/createCanvasPhotoActions.ts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Structure, tests, typecheck and Vite
        run: npm run build
