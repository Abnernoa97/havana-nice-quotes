name: Verify editor error styling
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-editor-error-scope-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit, tests, TypeScript and Vite
        run: npm run build
