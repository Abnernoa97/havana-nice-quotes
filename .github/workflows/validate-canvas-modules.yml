name: Validate canvas modularization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-canvas-modules.yml'
      - 'tests/blank-pages.test.mjs'
      - 'src/features/editor/canvas/TemplateCanvasEditor.tsx'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run audit, tests, typecheck and Vite build
        run: npm run build
